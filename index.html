<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>賽程自動轉換行前通知單與公假單產生器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract.js (OCR) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000;
      }
      .no-print {
        display: none !important;
      }
      .print-page {
        page-break-after: always;
        break-after: page;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      @page {
        size: A4 portrait;
        margin: 15mm;
      }
    }
    .dashed-line {
      border-bottom: 2px dashed #4b5563;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <!-- 頂部控制與設定面板 (列印時隱藏) -->
  <div class="no-print bg-white shadow-md border-b border-slate-200 mb-8">
    <div class="max-w-6xl mx-auto p-4 sm:p-6">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6 border-b pb-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">賽程轉換通知單與公假單產生器</h1>
          <p class="text-sm text-slate-500">支援上傳賽程圖片 (OCR) 或直接貼上文字自動解析生成文件</p>
        </div>
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          列印 / 輸出 PDF
        </button>
      </div>

      <!-- 輸入分頁控制 -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 左側：基本資訊與擴充注意事項設定 -->
        <div class="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="flex items-center justify-between border-b pb-2">
            <h2 class="font-bold text-slate-700 text-base">1. 賽事與集合時間資訊</h2>
            <button onclick="copyTournamentInfo(this)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium px-2.5 py-1 rounded transition">
              複製賽事資訊
            </button>
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">比賽名稱</label>
            <input type="text" id="tournamentName" value="2026第二屆桃園市航空城盃" class="w-full px-3 py-1.5 border rounded border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">比賽地點</label>
            <input type="text" id="tournamentLocation" value="桃園市立羽球館" class="w-full px-3 py-1.5 border rounded border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <!-- 比賽日期與集合時間列表 (1 ~ 10 日動態新增) -->
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-slate-600">比賽日期與集合時間</span>
              <div class="flex items-center gap-2">
                <span id="daysCountLabel" class="text-xs text-slate-500">已設定 2 / 10 日</span>
                <button type="button" id="addDayBtn" onclick="addDay()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded border border-blue-200 transition flex items-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed">
                  <span>+ 多加日期</span>
                </button>
              </div>
            </div>
            <div id="daysContainer" class="space-y-2.5"></div>
          </div>

          <!-- 擴充項目設定區 (字型大小及顏色自訂) -->
          <div class="pt-3 border-t space-y-4">
            <h3 class="font-bold text-slate-700 text-xs uppercase tracking-wider">表格後額外注意事項 (有內容才顯示 4, 5...)</h3>
            
            <!-- 行前準備與攜帶物品 -->
            <div class="space-y-1.5">
              <div class="flex flex-wrap items-center justify-between gap-1">
                <label class="block text-xs font-semibold text-slate-600">行前準備與攜帶物品</label>
                <div class="flex items-center gap-2">
                  <div class="flex items-center gap-1 text-xs text-slate-500">
                    <span>內文字級:</span>
                    <select id="prepFontSize" class="px-1.5 py-0.5 border rounded border-slate-300 text-xs bg-white focus:ring-1 focus:ring-blue-500 outline-none">
                      <option value="12px">小 (12px)</option>
                      <option value="14px" selected>標準 (14px)</option>
                      <option value="16px">中 (16px)</option>
                      <option value="18px">大 (18px)</option>
                      <option value="20px">特大 (20px)</option>
                    </select>
                  </div>
                  <div class="flex items-center gap-1 text-xs text-slate-500">
                    <span>內文顏色:</span>
                    <div class="flex items-center gap-1">
                      <input type="color" id="prepColor" value="#1e293b" title="點擊自訂顏色" class="w-5 h-5 p-0 border border-slate-300 rounded cursor-pointer bg-white">
                      <button type="button" onclick="setQuickColor('prepColor', '#1e293b')" class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-300 hover:scale-110 transition" title="預設黑色"></button>
                      <button type="button" onclick="setQuickColor('prepColor', '#2563eb')" class="w-3.5 h-3.5 rounded-full bg-blue-600 border border-slate-300 hover:scale-110 transition" title="藍色"></button>
                      <button type="button" onclick="setQuickColor('prepColor', '#dc2626')" class="w-3.5 h-3.5 rounded-full bg-red-600 border border-slate-300 hover:scale-110 transition" title="紅色"></button>
                    </div>
                  </div>
                </div>
              </div>
              <textarea id="prepItems" rows="2" placeholder="例如：&#10;☐ 出發當天穿新外套+長褲&#10;☐ 比賽用品：球拍、隊服、球褲、球鞋、擦汗毛巾、水壺。" class="w-full p-2 border rounded border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <!-- 行前注意事項 -->
            <div class="space-y-1.5">
              <div class="flex flex-wrap items-center justify-between gap-1">
                <label class="block text-xs font-semibold text-slate-600">行前注意事項</label>
                <div class="flex items-center gap-2">
                  <div class="flex items-center gap-1 text-xs text-slate-500">
                    <span>內文字級:</span>
                    <select id="noticeFontSize" class="px-1.5 py-0.5 border rounded border-slate-300 text-xs bg-white focus:ring-1 focus:ring-blue-500 outline-none">
                      <option value="12px">小 (12px)</option>
                      <option value="14px" selected>標準 (14px)</option>
                      <option value="16px">中 (16px)</option>
                      <option value="18px">大 (18px)</option>
                      <option value="20px">特大 (20px)</option>
                    </select>
                  </div>
                  <div class="flex items-center gap-1 text-xs text-slate-500">
                    <span>內文顏色:</span>
                    <div class="flex items-center gap-1">
                      <input type="color" id="noticeColor" value="#dc2626" title="點擊自訂顏色" class="w-5 h-5 p-0 border border-slate-300 rounded cursor-pointer bg-white">
                      <button type="button" onclick="setQuickColor('noticeColor', '#dc2626')" class="w-3.5 h-3.5 rounded-full bg-red-600 border border-slate-300 hover:scale-110 transition" title="紅色"></button>
                      <button type="button" onclick="setQuickColor('noticeColor', '#ea580c')" class="w-3.5 h-3.5 rounded-full bg-orange-600 border border-slate-300 hover:scale-110 transition" title="橘色"></button>
                      <button type="button" onclick="setQuickColor('noticeColor', '#1e293b')" class="w-3.5 h-3.5 rounded-full bg-slate-800 border border-slate-300 hover:scale-110 transition" title="黑色"></button>
                    </div>
                  </div>
                </div>
              </div>
              <textarea id="noticeItems" rows="2" placeholder="例如：請務必準時集合，逾時不候。" class="w-full p-2 border rounded border-slate-300 text-xs focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>
          </div>
        </div>

        <!-- 右側：資料來源 (圖片 / 文字) -->
        <div class="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
          <div>
            <h2 class="font-bold text-slate-700 text-base border-b pb-2 mb-3">2. 賽程資料來源 (圖片 / 文字)</h2>

            <!-- 圖片上傳區 -->
            <div class="mb-3">
              <label class="block text-xs font-semibold text-slate-600 mb-1">上傳賽程圖片 (OCR 自動辨識)</label>
              <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
              <div id="ocrStatus" class="text-xs text-blue-600 font-medium mt-1 hidden">正在解析圖片中，請稍候...</div>
            </div>

            <!-- 文字輸入區 -->
            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-semibold text-slate-600">或直接貼上賽程文字內容</label>
                <div class="flex items-center gap-1.5">
                  <button type="button" onclick="loadSampleText()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-medium px-2 py-1 rounded transition border border-blue-200" title="點擊帶入範例內容">
                    載入範例 (Sample)
                  </button>
                  <button type="button" onclick="copyRawText(this)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium px-2.5 py-1 rounded transition">
                    複製賽程文字
                  </button>
                  <button type="button" onclick="clearRawText()" class="bg-slate-100 hover:bg-red-50 text-slate-500 hover:text-red-600 text-xs font-medium px-1.5 py-1 rounded transition" title="清空文字框以檢視底層提示樣式">
                    清空
                  </button>
                </div>
              </div>
              <textarea id="rawText" rows="7" 
                placeholder="【範例格式 Sample】&#10;【2026-11-19】&#10;低年級&#10;選手A (低男單) : 12:00、14:30&#10;選手B (低男單) : 12:00、13:15" 
                class="w-full p-2 border rounded border-slate-300 text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>
          </div>

          <!-- 學生過濾挑選區 -->
          <div class="pt-2 border-t">
            <label class="block text-xs font-semibold text-slate-600 mb-1">選擇顯示學生</label>
            <select id="studentSelect" class="w-full px-3 py-1.5 border rounded border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
              <option value="ALL">-- 顯示全部學生 (預設列印全班) --</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 預覽/列印輸出區 -->
  <div id="outputContainer" class="max-w-4xl mx-auto space-y-8 px-4 sm:px-0"></div>

  <script>
    // 預設比賽賽程範例文字 (Sample)
    const sampleText = `【2026-11-19】
低年級
選手A (低男單) : 12:00、14:30
選手B (低男單) : 12:00、13:15`;

    document.getElementById('rawText').value = sampleText;

    // 載入範例文字
    function loadSampleText() {
      document.getElementById('rawText').value = sampleText;
      render();
    }

    // 清空賽程文字框
    function clearRawText() {
      document.getElementById('rawText').value = '';
      render();
    }

    // 快速切換顏色
    function setQuickColor(elementId, color) {
      const el = document.getElementById(elementId);
      if (el) {
        el.value = color;
        render();
      }
    }

    const MAX_DAYS = 10;
    const WEEKDAYS_ZH = ['日', '一', '二', '三', '四', '五', '六'];

    // 動態日期與集合時間資料 (預設 2 日，最多 10 日)
    const daysData = [
      { date: '2026-11-19 (四)', gather: '07:30', self: '08:00' },
      { date: '2026-11-20 (五)', gather: '07:30', self: '08:00' }
    ];

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getDayDateLabel(index) {
      const dayNum = index + 1;
      if (dayNum === 1) return '首日日期 (Day 1)';
      if (dayNum === 2) return '次日日期 (Day 2)';
      return `第 ${dayNum} 日日期 (Day ${dayNum})`;
    }

    // 依前一日日期推算下一日預設日期 (格式如 YYYY-MM-DD (週))
    function getNextDateSuggestion(prevDateStr) {
      if (!prevDateStr) return '';
      const m = prevDateStr.match(/(\d{4})([-\/\.])(\d{1,2})\2(\d{1,2})/);
      if (!m) return '';
      const year = Number(m[1]);
      const sep = m[2];
      const month = Number(m[3]);
      const day = Number(m[4]);
      const next = new Date(year, month - 1, day + 1);
      if (Number.isNaN(next.getTime())) return '';
      const yyyy = next.getFullYear();
      const mm = String(next.getMonth() + 1).padStart(2, '0');
      const dd = String(next.getDate()).padStart(2, '0');
      const wk = WEEKDAYS_ZH[next.getDay()];
      return `${yyyy}${sep}${mm}${sep}${dd} (${wk})`;
    }

    // 渲染左側動態日期設定欄位
    function renderDayInputs() {
      const container = document.getElementById('daysContainer');
      const countLabel = document.getElementById('daysCountLabel');
      const addBtn = document.getElementById('addDayBtn');
      if (!container) return;

      container.innerHTML = '';
      daysData.forEach((day, index) => {
        const dayNum = index + 1;
        const card = document.createElement('div');
        card.className = 'bg-white p-2.5 rounded-lg border border-slate-200 space-y-2';

        const removeBtnHtml = daysData.length > 1
          ? `<button type="button" onclick="removeDay(${index})" class="text-xs text-slate-400 hover:text-red-600 transition px-1" title="移除 Day ${dayNum}">移除</button>`
          : '';

        card.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-end">
            <div class="sm:col-span-5">
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-semibold text-slate-600">${getDayDateLabel(index)}</label>
                <span class="sm:hidden">${removeBtnHtml}</span>
              </div>
              <input type="text" data-day-index="${index}" data-field="date" value="${escapeHtml(day.date)}" placeholder="例如：2026-11-21 (六)" class="w-full px-2.5 py-1.5 border rounded border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="sm:col-span-3">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Day ${dayNum} 學校集合</label>
              <input type="text" data-day-index="${index}" data-field="gather" value="${escapeHtml(day.gather)}" placeholder="07:30" class="w-full px-2.5 py-1.5 border rounded border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="sm:col-span-3">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Day ${dayNum} 自行前往</label>
              <input type="text" data-day-index="${index}" data-field="self" value="${escapeHtml(day.self)}" placeholder="08:00" class="w-full px-2.5 py-1.5 border rounded border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="hidden sm:flex sm:col-span-1 justify-end pb-1.5">
              ${removeBtnHtml}
            </div>
          </div>
        `;

        card.querySelectorAll('input[data-day-index]').forEach(input => {
          const handleEdit = (e) => {
            const idx = Number(e.target.dataset.dayIndex);
            const field = e.target.dataset.field;
            if (daysData[idx]) {
              daysData[idx][field] = e.target.value;
              render();
            }
          };
          input.addEventListener('input', handleEdit);
          input.addEventListener('change', handleEdit);
        });

        container.appendChild(card);
      });

      if (countLabel) {
        countLabel.textContent = daysData.length >= MAX_DAYS
          ? `已達上限 ${MAX_DAYS} 日`
          : `已設定 ${daysData.length} / ${MAX_DAYS} 日`;
      }
      if (addBtn) {
        addBtn.disabled = daysData.length >= MAX_DAYS;
      }
    }

    // 多加日期 (最多十日)
    function addDay() {
      if (daysData.length >= MAX_DAYS) return;
      const prev = daysData[daysData.length - 1];
      daysData.push({
        date: getNextDateSuggestion(prev ? prev.date : ''),
        gather: prev ? prev.gather : '07:30',
        self: prev ? prev.self : '08:00'
      });
      renderDayInputs();
      render();
    }

    // 移除指定日期 (至少保留一日)
    function removeDay(index) {
      if (daysData.length <= 1) return;
      daysData.splice(index, 1);
      renderDayInputs();
      render();
    }

    // 複製賽事與集合時間資訊功能
    function copyTournamentInfo(btn) {
      const tName = document.getElementById('tournamentName').value;
      const tLoc = document.getElementById('tournamentLocation').value;
      const prep = document.getElementById('prepItems').value;
      const notice = document.getElementById('noticeItems').value;

      let infoText = `比賽名稱：${tName}\n比賽地點：${tLoc}\n`;
      infoText += `----------------------------------\n`;
      daysData.forEach((day, idx) => {
        infoText += `【${day.date || `Day ${idx + 1}`}】\n- 學校集合：${day.gather}\n- 自行前往：${day.self}`;
        if (idx < daysData.length - 1) {
          infoText += `\n\n`;
        }
      });
      
      if (prep.trim()) {
        infoText += `\n\n【行前準備與攜帶物品】\n${prep}`;
      }
      if (notice.trim()) {
        infoText += `\n\n【行前注意事項】\n${notice}`;
      }

      navigator.clipboard.writeText(infoText).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '已複製！';
        btn.classList.add('bg-green-100', 'text-green-700');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('bg-green-100', 'text-green-700');
        }, 1500);
      }).catch(err => {
        alert('複製失敗，請手動複製。');
        console.error(err);
      });
    }

    // 複製賽程文字功能
    function copyRawText(btn) {
      const rawTextEl = document.getElementById('rawText');
      const textToCopy = rawTextEl.value;

      navigator.clipboard.writeText(textToCopy).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '已複製！';
        btn.classList.add('bg-green-100', 'text-green-700');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('bg-green-100', 'text-green-700');
        }, 1500);
      }).catch(err => {
        alert('複製失敗，請手動反白複製。');
        console.error(err);
      });
    }

    // 解析文字為學生資料結構
    function parseSchedule(text) {
      const lines = text.split('\n');
      let currentDate = '';
      const students = {};

      lines.forEach(line => {
        line = line.trim();
        if (!line || line.startsWith('//') || line.startsWith('#')) return;

        // 辨識日期標籤 (如：【2026-11-19】或 2026-11-19，忽略純【範例】或【Sample】標籤)
        const dateMatch = line.match(/【.*?(\d{4}[-\/\.]\d{1,2}[-\/\.]\d{1,2}.*?)】/) || 
                          line.match(/【(.*?\d{1,2}月\d{1,2}日.*?)】/) ||
                          line.match(/【(.*?\d+.*?)】/) ||
                          line.match(/(\d{4}[-\/\.]\d{1,2}[-\/\.]\d{1,2})/);

        if (dateMatch) {
          currentDate = dateMatch[1];
          return;
        }

        const match = line.match(/^([^\s\(\:：]+)\s*\(([^)]+)\)\s*[:：]\s*(.*)$/);
        if (match) {
          const name = match[1].trim();
          const category = match[2].trim();
          const timesStr = match[3].trim();
          const times = timesStr.split(/[、,]/).map(t => t.trim());

          if (!students[name]) {
            students[name] = { name, schedules: [] };
          }

          students[name].schedules.push({
            date: currentDate || '未指定日期',
            category: category,
            times: times
          });
        }
      });

      return Object.values(students);
    }

    // 更新學生下拉選單選項
    function updateStudentSelect(students) {
      const select = document.getElementById('studentSelect');
      const currentVal = select.value;
      select.innerHTML = '<option value="ALL">-- 顯示全部學生 (預設列印全班) --</option>';
      
      students.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st.name;
        opt.textContent = st.name;
        select.appendChild(opt);
      });

      if (students.some(s => s.name === currentVal)) {
        select.value = currentVal;
      }
    }

    // 解析日期字串中的年月日數值，避免跨日誤判
    function extractDateParts(str) {
      if (!str) return null;
      let m = str.match(/(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
      if (m) {
        return { year: Number(m[1]), month: Number(m[2]), day: Number(m[3]) };
      }
      m = str.match(/(?:(\d{4})年\s*)?(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
      if (m) {
        return { year: m[1] ? Number(m[1]) : null, month: Number(m[2]), day: Number(m[3]) };
      }
      m = str.match(/(?:^|[^\d])(\d{1,2})[-\/\.](\d{1,2})(?!\d)/);
      if (m) {
        return { year: null, month: Number(m[1]), day: Number(m[2]) };
      }
      return null;
    }

    // 日期比對輔助函式
    function matchDate(schedDate, inputDateStr) {
      if (!schedDate || !inputDateStr) return false;
      const sTrim = schedDate.trim();
      const iTrim = inputDateStr.trim();
      if (sTrim === iTrim) return true;

      const p1 = extractDateParts(sTrim);
      const p2 = extractDateParts(iTrim);
      if (p1 && p2) {
        if (p1.year && p2.year && p1.year !== p2.year) return false;
        return p1.month === p2.month && p1.day === p2.day;
      }
      return iTrim.includes(sTrim) || sTrim.includes(iTrim);
    }

    function renderDayHeaderContent(day) {
      return `
        <div class="font-bold">日期: ${escapeHtml(day.date)}</div>
        <div class="font-normal text-xs sm:text-sm mt-1">學校集合：${escapeHtml(day.gather)} | 自行前往：${escapeHtml(day.self)}</div>
      `;
    }

    function renderDaySchedulesHtml(schedules) {
      if (schedules.length === 0) {
        return '<div class="text-gray-400 text-center py-4">今日無賽程安排</div>';
      }
      return schedules.map(s => `
        <div class="mb-3 last:mb-0">
          <div class="font-bold text-slate-800">[${escapeHtml(s.category)}]</div>
          <div class="text-sm pl-2">賽程時間：${escapeHtml(s.times.join('、'))}</div>
        </div>
      `).join('');
    }

    function renderScheduleTableRows(student) {
      let rowsHtml = '';
      for (let i = 0; i < daysData.length; i += 2) {
        const dayA = daysData[i];
        const dayB = daysData[i + 1];
        const isLastPair = i + 2 >= daysData.length;
        const bottomBorderClass = isLastPair ? '' : 'border-b border-black';
        const schedA = student.schedules.filter(s => matchDate(s.date, dayA.date));

        if (dayB) {
          const schedB = student.schedules.filter(s => matchDate(s.date, dayB.date));
          rowsHtml += `
            <tr class="border-b border-black">
              <th class="w-1/2 border-r border-black p-2 bg-slate-50">${renderDayHeaderContent(dayA)}</th>
              <th class="w-1/2 p-2 bg-slate-50">${renderDayHeaderContent(dayB)}</th>
            </tr>
            <tr>
              <td class="border-r border-black p-3 sm:p-4 text-left align-top ${bottomBorderClass}">${renderDaySchedulesHtml(schedA)}</td>
              <td class="p-3 sm:p-4 text-left align-top ${bottomBorderClass}">${renderDaySchedulesHtml(schedB)}</td>
            </tr>
          `;
        } else {
          rowsHtml += `
            <tr class="border-b border-black">
              <th colspan="2" class="w-full p-2 bg-slate-50">${renderDayHeaderContent(dayA)}</th>
            </tr>
            <tr>
              <td colspan="2" class="p-3 sm:p-4 text-left align-top ${bottomBorderClass}">${renderDaySchedulesHtml(schedA)}</td>
            </tr>
          `;
        }
      }
      return rowsHtml;
    }

    // 渲染通知單與公假單列表
    function render() {
      const text = document.getElementById('rawText').value;
      const students = parseSchedule(text);
      updateStudentSelect(students);

      const selectedName = document.getElementById('studentSelect').value;
      const filtered = selectedName === 'ALL' ? students : students.filter(s => s.name === selectedName);

      const tName = document.getElementById('tournamentName').value || '填比賽名稱';
      const tLoc = document.getElementById('tournamentLocation').value || '填比賽地點';

      const activeDates = daysData.map(d => d.date.trim()).filter(Boolean);
      let dateRangeText = '未設定日期';
      if (activeDates.length === 1) {
        dateRangeText = activeDates[0];
      } else if (activeDates.length >= 2) {
        dateRangeText = `${activeDates[0]} ~ ${activeDates[activeDates.length - 1]}`;
      }

      // 取得動態擴充欄位內容與字型大小、顏色
      const prepItems = document.getElementById('prepItems').value.trim();
      const noticeItems = document.getElementById('noticeItems').value.trim();
      const prepFontSize = document.getElementById('prepFontSize').value;
      const prepColor = document.getElementById('prepColor').value;
      const noticeFontSize = document.getElementById('noticeFontSize').value;
      const noticeColor = document.getElementById('noticeColor').value;

      const container = document.getElementById('outputContainer');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-12 rounded-xl border border-dashed border-slate-300 text-center text-slate-400">
            <svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <div class="text-base font-semibold text-slate-600 mb-1">尚未輸入賽程資料</div>
            <p class="text-sm">請於上方貼上賽程文字、上傳賽程圖片或點擊「載入範例 (Sample)」產生通知單。</p>
          </div>
        `;
        return;
      }

      filtered.forEach(student => {
        const card = document.createElement('div');
        card.className = 'print-page bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-slate-900 font-sans leading-relaxed';

        // 產生 4. 5. 後續欄位 HTML (標題維持黑色且字級與 1.2.3. 一致，僅內文調整大小與顏色，緊接下一行不空行)
        let extraListHtml = '';
        let nextIndex = 4;
        if (prepItems) {
          extraListHtml += `<li class="font-bold text-base mt-2.5 text-slate-900" value="${nextIndex}">` +
            `<span>行前準備與攜帶物品：</span>` +
            `<div class="font-normal pl-4 whitespace-pre-line leading-relaxed" style="font-size: ${prepFontSize}; color: ${prepColor} !important;">${escapeHtml(prepItems)}</div>` +
            `</li>`;
          nextIndex++;
        }
        if (noticeItems) {
          extraListHtml += `<li class="font-bold text-base mt-2.5 text-slate-900" value="${nextIndex}">` +
            `<span>行前注意事項：</span>` +
            `<div class="font-normal pl-4 whitespace-pre-line leading-relaxed" style="font-size: ${noticeFontSize}; color: ${noticeColor} !important;">${escapeHtml(noticeItems)}</div>` +
            `</li>`;
        }

        card.innerHTML = `
          <!-- 標題 -->
          <div class="text-center font-bold text-2xl tracking-wide mb-6">
            「 ${escapeHtml(tName)} 」 行前通知單
          </div>

          <!-- 親愛的家長內文與注意事項 -->
          <div class="text-base font-medium space-y-2 mb-3">
            <p>親愛的家長您好：</p>
            <p>孩子們將代表學校參加「 <span class="font-bold border-b border-black px-1">${escapeHtml(tName)}</span> 」，在此通知注意事項：</p>
          </div>

          <!-- 條目 1, 2, 3 -->
          <ol class="list-decimal list-inside font-bold text-base space-y-1 mb-3">
            <li>比賽日期：<span class="font-normal">${escapeHtml(dateRangeText)}</span></li>
            <li>比賽地點：<span class="font-normal">${escapeHtml(tLoc)}</span></li>
            <li>集合時間：</li>
          </ol>

          <!-- 多日時間對照表格 (緊接在 3. 集合時間 下方) -->
          <table class="w-full border-collapse border border-black text-center mb-4 text-sm sm:text-base">
            <tbody>
              ${renderScheduleTableRows(student)}
            </tbody>
          </table>

          <!-- 續接 4, 5 條目 (表格下方) -->
          ${extraListHtml ? `<ol class="list-decimal list-inside font-bold text-base text-slate-900 mb-6">${extraListHtml}</ol>` : '<div class="mb-6"></div>'}

          <!-- 撕下聯提示與虛線 -->
          <div class="text-center font-medium text-sm text-slate-700 mb-2">
            麻煩家長確認孩子參賽時間（勾選），沿虛線撕下此聯交給導師
          </div>
          <div class="dashed-line my-4"></div>

          <!-- 公假單回條區塊 -->
          <div class="pt-2 text-base">
            <div class="font-bold mb-3 flex items-center">
              <span class="border-b-2 border-black text-lg px-2 mr-1">${escapeHtml(student.name)}</span> 
              因代表學校參加「 ${escapeHtml(tName)} 」，需請公假外出參賽
            </div>
            <div class="font-semibold mb-2">時間如下：</div>

            <div class="space-y-2 pl-4 text-sm sm:text-base">
              ${student.schedules.map(s => `
                <div class="flex items-start gap-2">
                  <input type="checkbox" checked class="mt-1 h-4 w-4 rounded border-gray-400">
                  <span>${escapeHtml(s.date)} ${escapeHtml(s.category)} (${escapeHtml(s.times.join('、'))})</span>
                </div>
              `).join('')}
            </div>

            <div class="mt-6 flex justify-between items-end font-semibold pt-4">
              <div>請導師惠予公假協助，感謝您的支持！</div>
              <div class="text-sm border-b border-black pb-1 px-4">
                家長簽章：__________________
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // 監聽固定設定元件變更並重新渲染
    ['tournamentName', 'tournamentLocation', 'prepItems', 'noticeItems', 'prepFontSize', 'prepColor', 'noticeFontSize', 'noticeColor', 'rawText', 'studentSelect'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', render);
        el.addEventListener('change', render);
      }
    });

    // 處理圖片上傳 (OCR)
    document.getElementById('imageInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('ocrStatus');
      statusEl.classList.remove('hidden');
      statusEl.textContent = '正在利用 OCR 解析圖片中的文字，請稍候...';

      try {
        const worker = await Tesseract.createWorker('chi_tra');
        const ret = await worker.recognize(file);
        await worker.terminate();

        statusEl.classList.add('hidden');
        if (ret.data.text) {
          document.getElementById('rawText').value = ret.data.text;
          render();
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = '圖片解析失敗，請重新嘗試或手動貼上文字。';
      }
    });

    // 初始化日期設定欄位與首次渲染
    renderDayInputs();
    render();
  </script>
</body>
</html>
